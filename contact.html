
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - EduTech Institute</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-graduation-cap logo-icon"></i>
            <div class="logo-text">
                <h2>EduTech Institute</h2>
                <p>Excellence in Education</p>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
        <a href="apply.html" class="btn">Apply Now</a>
    </header>

    <main style="padding: 4rem 5%; background-color: var(--bg-light); min-height: 60vh; display: flex; justify-content: center;">
        <div style="background: var(--bg-white); padding: 3rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 600px;">
            <h1 style="color: var(--primary-blue); font-size: 2rem; margin-bottom: 1.5rem;">Get in Touch</h1>
            
            <div style="margin-bottom: 2rem;">
                <p><strong>Email:</strong> info@edutechinstitute.edu</p>
                <p><strong>Phone:</strong> +1 (555) 123-4567</p>
                <p><strong>Address:</strong> 123 Education Ave, Tech City, ST 90210</p>
            </div>

            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 1rem;">
                <input type="text" placeholder="Your Name" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: var(--font-main);">
                <input type="email" placeholder="Your Email" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: var(--font-main);">
                <textarea placeholder="Your Message" rows="5" required style="padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: var(--font-main); resize: vertical;"></textarea>
                <button type="submit" class="btn" style="border: none; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 EduTech Institute. All rights reserved.</p>
    </footer>

</body>
</html>
