<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-container {
            max-width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        #success-message {
            color: green;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Apply Now</h2>

    <div class="form-container">
        <!-- The method is set to GET to avoid the 405 error -->
        <form action="index.html" method="GET">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <button type="submit">Submit Application</button>
        </form>
    </div>

    <!-- This is where the success message will appear after submitting -->
    <div id="success-message"></div>

    <!-- JavaScript to grab the submitted data and show it on the screen -->
    <script>
        // Check the URL for the submitted data
        const urlParams = new URLSearchParams(window.location.search);
        const submittedName = urlParams.get('name');
        
        // If a name was submitted, display the success message
        if (submittedName) {
            const messageDiv = document.getElementById('success-message');
            messageDiv.innerHTML = "Success! Application received for: " + submittedName;
        }
    </script>

</body>
</html>
